allowBuilds:
  esbuild: true
  unrs-resolver: true
# 🛡️ pnpm 11 minimumReleaseAge (1 day) stays ON. Strict mode: pnpm fails instead of quietly adding
#    exclude entries by itself (pnpm 11.28+), so every exemption is a reviewed, test-guarded line.
minimumReleaseAgeStrict: true
# ⏳ D33 (scoped, expiring exemptions): NONE right now. When a sibling ab-nextjs-* release is < 24h old,
#    add ONE exact `name@version` here, its expiry in __tests__/release-age.test.ts ALLOWED_EXCLUDES
#    (registry publish time + 24h), and a TODO to remove it. The expired theme@0.3.3 entry is gone.
